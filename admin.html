<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Administration | Abdelaziz Talhaoui</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #1f2937;
    }

    .container {
      width: min(1100px, 92%);
      margin: 40px auto;
    }

    .card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,.04);
    }

    h1,
    h2 {
      margin-top: 0;
    }

    .muted {
      color: #6b7280;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font: inherit;
      margin-bottom: 16px;
    }

    textarea {
      min-height: 300px;
      resize: vertical;
      font-family: monospace;
      font-size: 14px;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 11px 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .primary {
      background: #111827;
      color: white;
    }

    .secondary {
      background: #e5e7eb;
      color: #111827;
    }

    .danger {
      background: #fee2e2;
      color: #991b1b;
    }

    .hidden {
      display: none;
    }

    .status {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      display: none;
    }

    .status.success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .status.error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    #sections {
      display: grid;
      gap: 20px;
    }
  </style>
</head>

<body>

  <main class="container">

    <!-- CONNEXION -->
    <section id="loginSection" class="card">

      <h1>Administration</h1>

      <p class="muted">
        Gestion du contenu du portfolio
      </p>

      <form id="loginForm">

        <label for="email">
          Adresse e-mail
        </label>

        <input
          id="email"
          type="email"
          required
          autocomplete="email"
        >

        <label for="password">
          Mot de passe
        </label>

        <input
          id="password"
          type="password"
          required
          autocomplete="current-password"
        >

        <button
          type="submit"
          class="primary"
        >
          Se connecter
        </button>

      </form>

      <div id="loginStatus" class="status"></div>

    </section>


    <!-- ADMIN -->
    <section id="adminSection" class="hidden">

      <div class="topbar">

        <div>
          <h1>Gestion du portfolio</h1>

          <p class="muted">
            Les modifications sont enregistrées dans Supabase.
          </p>
        </div>

        <div class="actions">

          <button
            id="logoutBtn"
            class="danger"
            type="button"
          >
            Déconnexion
          </button>

        </div>

      </div>


      <div id="sections"></div>

    </section>

  </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="assets/supabase.js"></script>

  <script src="assets/admin.js"></script>

</body>
</html>
