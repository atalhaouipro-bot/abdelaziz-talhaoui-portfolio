<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test portfolio</title>
</head>

<body>

  <h1>Test du chargement Supabase</h1>

  <pre id="result">Test en cours...</pre>

  <script src="content/data.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="assets/supabase.js"></script>

  <script src="assets/content-loader.js"></script>

  <script>
    window.addEventListener("content-ready", () => {

      const result = document.getElementById("result");

      const sections = Object.keys(window.DATA);

      result.textContent =
        "✅ CONTENT-READY reçu\n\n" +
        "Sections disponibles : " +
        sections.length +
        "\n\n" +
        sections.join("\n") +
        "\n\n" +
        "Nom : " +
        window.DATA.profile.name +
        "\n\n" +
        "Titre FR : " +
        window.DATA.profile.title.fr;

    }, { once: true });
  </script>

</body>
</html>
